h1{margin:0 0 12px;font-size:clamp(28px,4vw,42px);font-weight:700;line-height:1.14;letter-spacing:-.055em}p{margin:0 0 18px;color:var(--muted)}fieldset{border:0;margin:0;padding:0;min-width:0}.options{display:grid;gap:10px}.cards .options{grid-template-columns:repeat(2,minmax(0,1fr))}.option{position:relative;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--control);border-radius:14px;padding:14px 16px;min-height:54px;cursor:pointer}.option:hover{background:var(--blush)}.option:has(input:checked){background:var(--blush);border-color:var(--plum);box-shadow:inset 0 0 0 1px var(--plum)}.option:focus-within{outline:3px solid var(--focus);outline-offset:3px}.option input{accent-color:var(--plum);width:18px;height:18px;margin:3px 0 0;flex:none}.option strong{display:block;font-size:15px}.option small{color:var(--muted);display:block;margin-top:3px;font-size:13px}.railmode .options.chips{display:flex;flex-wrap:wrap}.railmode .chips .option{border-radius:999px;align-items:center}.railmode .chips .option small{display:none}.examples{margin-top:16px}.examples summary{cursor:pointer;color:var(--plum);font-weight:700}.examples ul{padding-left:22px}

:root {


    --radius:22px; --shadow:none;
}
body {font:400 16px/1.5 Barlow,system-ui,sans-serif}
.lab {padding-top:16px}
.switch {background:var(--canvas)}
.switch [aria-pressed=true] {color:var(--ink)}
.shell {border-radius:20px}
.header {background:var(--canvas);position:relative;min-height:65px;justify-content:center}
.header .link {position:absolute;right:20px;color:var(--muted)}
.brand {font:700 25px/1.15 Barlow,system-ui,sans-serif;letter-spacing:-.05em;color:var(--ink)}

.frame {min-height:560px}
.frame[data-layout=cards] {
 padding:48px 24px;
 background-image:linear-gradient(color-mix(in srgb, var(--line) 53%, transparent) 1px, transparent 1px),linear-gradient(90deg,color-mix(in srgb, var(--line) 53%, transparent) 1px, transparent 1px);
 background-size:132px 132px;
 background-color:var(--canvas);
}
.frame[data-layout=cards] main {width:min(100%,630px);padding:32px}
.rail,.split .rail {background:var(--canvas)}
.split .rail {background:radial-gradient(ellipse at 0 90%,var(--peach),transparent 76%),var(--canvas)}
.rail h2 {font:600 22px/1.3 Barlow,system-ui,sans-serif;letter-spacing:-.025em}
.rail li[aria-current=step] {color:var(--ink)}
.rail li[aria-current=step] .dot {background:var(--coral);border-color:var(--plum)}
h1 {font:700 clamp(25px,3.1vw,32px)/1.23 Barlow,system-ui,sans-serif;letter-spacing:-.035em;margin-bottom:8px;text-wrap:balance}
main:has(fieldset) > h1, main:has(fieldset) > p {text-align:center}
main:has(fieldset) > p {margin:0 0 24px;max-width:46ch}
main:has(fieldset) > h1 + fieldset {margin-top:24px}
.options,.railmode .options.chips {display:grid;gap:12px}
.railmode .options.chips {grid-template-columns:repeat(2,minmax(0,1fr))}
.option,.railmode .chips .option {
 border-color:var(--line); border-radius:16px; padding:15px 38px 15px 15px;
 align-items:stretch;position:relative;min-height:53px;
}
.option:hover {background:var(--blush)}
.option:has(input:checked) {background:var(--paper);border-color:var(--coral);box-shadow:inset 0 0 0 1px var(--coral)}
.option strong {font-size:15px;font-weight:600;line-height:1.35}
.option small,.railmode .chips .option small {display:block;color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.chips .option > span {display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:76px}
.split .chips .option > span {min-height:0;gap:4px}
.option input {
 appearance:none;position:absolute;top:15px;right:14px;
 border:1px solid var(--control);border-radius:50%;margin:0;width:18px;height:18px;
 display:grid;place-content:center;background:var(--paper);
}
.option input:checked {background:var(--coral);border-color:var(--plum)}
.option input:checked::before {content:"";width:8px;height:4px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translateY(-1px)}
.option:focus-within {outline:none}
.option:has(input:focus-visible) {outline:3px solid var(--focus);outline-offset:3px}
.examples {display:none}
.actions {justify-content:flex-end;align-items:center;gap:10px;margin-top:24px}
.progress {margin:0 auto 0 0}
.progress span {display:none}
.progress progress {width:52px;background:var(--line);height:5px}
progress::-webkit-progress-bar {background:var(--line)}
progress::-webkit-progress-value {background:var(--ink)}
progress::-moz-progress-bar {background:var(--ink)}
.button {min-height:44px;border-radius:11px;font-weight:600;min-width:112px}
.primary {background:linear-gradient(110deg,var(--plum),var(--plum));color:var(--ink);border-color:var(--plum)}
.primary:hover {background:var(--hover)}
.product h2 {font:600 21px/1.3 Barlow,system-ui,sans-serif}
@media(max-width:760px){
 .frame[data-layout=cards] {padding:0}
 .frame[data-layout=cards] main {padding:26px 16px}
 .railmode .options.chips {grid-template-columns:1fr}
 .chips .option > span {min-height:0;gap:5px}
 .header .link {right:6px}
 .actions {flex-wrap:wrap}
 .actions .button {min-width:0;padding-inline:14px}
}

:root {


  --radius:18px; --shadow:none;
}
body {font-family:Barlow,system-ui,sans-serif}
.lab {column-gap:16px}
.switch {background:var(--peach)}
.preview-label {font-size:13px;font-weight:700}
.preview-label select {margin-left:5px;min-height:40px;border-radius:8px;border:1px solid var(--control);background:var(--paper);color:var(--ink);font:inherit;padding:6px}
.shell {max-width:1220px}
.header {background:var(--ink);color:var(--paper);justify-content:flex-start;padding:16px 27px}
.header .link {color:var(--paper)}
.brand {font:700 27px/1 Barlow,system-ui,sans-serif;letter-spacing:-.065em;color:inherit}

.frame[data-layout=cards] {background:var(--blush);background-image:none}
.rail,.split .rail {background:var(--peach)}
.frame[data-layout=rail] .rail {
 display:flex;
 flex-direction:column;
 background:
  radial-gradient(ellipse 145% 95% at -15% 100%, var(--peach) 0%, var(--peach) 40%, transparent 85%),
  var(--canvas);
}
.frame[data-layout=rail] .rail {
 position:relative;
 isolation:isolate;
 overflow:hidden;
}
.rail-portrait {
 position:absolute;
 z-index:-1;
 inset:auto 0 0;
 height:min(54%, 380px);
 background:
  linear-gradient(130deg, color-mix(in srgb, var(--peach) 25%, transparent), color-mix(in srgb, var(--accent-purple) 9%, transparent)),
  var(--skincare-photo) 52% 43% / cover no-repeat;
 mask-image:linear-gradient(to bottom, transparent 0%, color-mix(in srgb, var(--ink) 40%, transparent) 23%, var(--ink) 52%);
}
.frame[data-layout=rail] .rail ol {
 position:relative;
}
@media(max-width:760px){
 .frame[data-layout=rail] .rail {display:none}
}
.rail h2 {font:600 26px/1.15 Barlow,system-ui,sans-serif}
h1 {font:600 clamp(29px,4vw,44px)/1.08 Barlow,system-ui,sans-serif;letter-spacing:-.065em}
main:has(fieldset)>h1,main:has(fieldset)>p {text-align:left}
.frame[data-view=welcome] {display:block;min-height:0;padding:0;background:var(--paper)}
.frame[data-view=welcome] .rail {display:none}
.frame[data-view=welcome] main {display:grid;grid-template-columns:1.12fr 1fr;max-width:none;width:100%;padding:0;border:none;border-radius:0}
.hero-copy {background:var(--lime);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:clamp(30px,6vw,92px)}
.hero-copy h1 {font-size:clamp(54px,7.5vw,112px);line-height:.88;max-width:7ch;margin-bottom:28px}
.hero-copy h1 em {display:block;font:italic 400 1.03em/.93 Barlow,system-ui,sans-serif;letter-spacing:-.025em}
.hero-copy p {color:var(--ink);max-width:28ch;margin-bottom:24px}
.hero-media {background:var(--peach);min-width:0;min-height:470px;position:relative}
.hero-photo {position:absolute;inset:0;background:var(--skincare-photo) 50% 42% / cover no-repeat}
.option,.railmode .chips .option {background:var(--paper);border-color:var(--line)}
.option:hover {background:var(--peach)}
.options .option:has(input:checked) {
 background:var(--paper);
 border-color:var(--line);
 box-shadow:inset 0 0 0 1px var(--plum);
}
.option input:checked {background:var(--lime);border-color:var(--plum)}
.rail li[aria-current=step] .dot {background:var(--lime);border-color:var(--plum)}
.button {border-radius:999px}
.primary,.primary:hover {background:var(--ink);color:var(--paper);border-color:var(--ink)}
.primary:hover {background:var(--hover)}
.hero-copy .primary {min-height:48px;padding-inline:24px}
.frame[data-view=results] main {width:100%;max-width:940px}
.frame[data-view=results] .routine {grid-template-columns:repeat(3,minmax(0,1fr))}
.product {padding:20px 16px;border-radius:14px;background:var(--peach)}
.product:nth-child(2) {background:var(--peach)}
.product:nth-child(3) {background:var(--peach)}
.product h2 {font:500 29px/1.04 Barlow,system-ui,sans-serif}
.product small {font-size:12px}
@media(max-width:760px){
 .frame[data-view=welcome] main {grid-template-columns:1fr}
 .hero-copy {padding:36px 24px}
 .hero-media {min-height:250px}
 .frame[data-view=results] .routine {grid-template-columns:1fr}

:root {



}
.shell {border-radius:12px}
.header {background:var(--paper);color:var(--ink)}
.header .link {color:var(--muted)}
.brand {font:400 34px/1 Barlow,system-ui,sans-serif;letter-spacing:-.065em}
.switch {background:var(--peach)}
.frame[data-layout=cards] {background:var(--canvas)}
.split .rail {background:radial-gradient(ellipse at 0 95%,var(--peach),transparent 78%),var(--peach)}
.frame[data-layout=rail] .rail {background:radial-gradient(ellipse 130% 95% at -15% 100%,var(--peach) 0%,var(--peach) 45%,transparent 88%),var(--canvas)}
.rail-portrait {
 height:min(53%, 370px);
 background:linear-gradient(0deg,color-mix(in srgb, var(--accent-purple) 16%, transparent),transparent 52%),var(--skincare-photo) 50% 39% / cover no-repeat;
 mask-image:linear-gradient(to bottom,transparent,var(--ink) 38%);
}
.rail h2,h1,.product h2 {font-family:Barlow,system-ui,sans-serif;font-weight:400;letter-spacing:-.045em}
h1 {font-size:clamp(32px,4vw,54px);line-height:1.03}
.hero-copy {background:var(--peach)}
.hero-copy h1 {max-width:9ch;font-size:clamp(52px,7.5vw,110px);line-height:.93}
.hero-copy h1 em {font-family:Barlow,system-ui,sans-serif;font-size:.93em;line-height:1.06}
.hero-copy p {color:var(--muted)}
.hero-media {background:var(--peach)}
.hero-photo {background-position:50% 42%}
.option:hover {background:var(--blush)}
.option input:checked {background:var(--plum);border-color:var(--plum)}
.option input:checked::before {border-color:var(--paper)}
.primary {background:var(--plum);color:var(--paper);border-color:var(--plum)}
.primary:hover {background:var(--hover);border-color:var(--hover)}
.product,.product:nth-child(2),.product:nth-child(3) {background:var(--peach)}
.product:nth-child(2) {background:var(--blush)}
.product:nth-child(3) {background:var(--peach)}
.purchase-preview{margin:0 0 8px}
.purchase-preview img{display:block;width:100%;height:160px;object-fit:contain;background:var(--paper);border-radius:12px}
.purchase-preview figcaption{margin-top:4px;color:var(--muted);font-size:12px}
.purchase-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:5px 12px;border:1px solid var(--control);border-radius:999px;color:var(--plum);background:var(--paper);font-size:14px;font-weight:700;text-decoration:none}
.purchase-link:hover{background:var(--blush);text-decoration:underline}
.purchase-link:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.product .purchase-note{margin:6px 0 0;font-size:13px;color:var(--muted)}

.product-badges li{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font:600 12px/1.4 Barlow,system-ui,sans-serif;color:var(--plum)}

 .frame[data-view=help] .product {padding:20px 22px}
 .frame[data-view=help] .product h2 {margin-bottom:12px}
 .frame[data-view=help] .product p + p {margin-top:10px}
 .help-intro {margin:0 0 22px}
 .help-overlap {margin:20px 0 0;color:var(--muted)}

/* Brand v2: presentation only. Journey, content and photo assets are unchanged. */
body,button,input,select,.product-badges li {font-family:Barlow,system-ui,sans-serif}
body {font-weight:500}
h1,h2,h3,.rail h2,.product h2,.hero-copy h1 em {font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;font-style:normal;text-transform:uppercase;letter-spacing:.02em}
.brand {min-width:0;flex-shrink:0;letter-spacing:normal}
.brand-word {font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:30px;font-weight:400;letter-spacing:.06em;line-height:1;color:var(--accent-purple);white-space:nowrap;display:inline-block}
.brand-word i {font-style:normal;color:var(--accent-red)}
.hero-copy {background:var(--peach)}
.header {background:var(--paper);color:var(--ink)}
.primary,.primary:hover {background:var(--plum);color:var(--paper);border-color:var(--plum);font-size:20px;font-weight:700;line-height:1.25}
.primary:hover {background:var(--hover);border-color:var(--hover)}
.product small,.product-badges li,.progress {color:var(--accent-purple)}
.product small,.product-badges li {text-transform:uppercase;letter-spacing:.04em}
.purchase-link {color:var(--accent-purple)}
.product .ingredient {color:var(--muted)}
.error {color:var(--hover)}
progress::-webkit-progress-value {background:var(--plum)}
progress::-moz-progress-bar {background:var(--plum)}
.product,.product:nth-child(2),.product:nth-child(3) {background:var(--paper)}
.product:nth-child(2) {background:var(--peach)}
.options .option:has(input:checked) {border-color:var(--plum);box-shadow:inset 0 0 0 1px var(--plum);background:var(--blush)}
.option input:checked,.rail li[aria-current=step] .dot {background:var(--plum);border-color:var(--plum)}
@media(max-width:760px){.header{gap:16px}.header .link{position:static;margin-left:auto;flex-shrink:0}.brand-word{white-space:nowrap}}
</style></head><body>

<div class="shell"><header class="header"><div class="brand"><span class="brand-word" aria-label="Swan">SWAN<i>.</i></span></div><button class="link" id="reset">Start over</button></header>
<div class="frame" id="frame" data-layout="split"><aside class="rail" id="rail"></aside><main id="screen"></main></div></div>
<script>
const names=['Acne-prone skin and blemishes','Dryness and skin barrier','Sensitive or easily irritated skin'];
const examples=['Spots, blackheads or clogged pores.','Skin that often feels tight, rough or flaky.','Skin that easily feels uncomfortable with new products.','See examples to help you choose a focus.'];
const concernImages=[
 {src:'/assets/skin-blemishes.png',alt:'Generated close-up example of skin with a few blemishes and small bumps'},
 {src:'/assets/skin-dryness.png',alt:'Generated close-up example of dry skin with fine flakes'},
 {src:'/assets/skin-sensitivity.png',alt:'Generated close-up example of skin with patchy redness'}
];
const concernHelp=[
 ['You often notice spots, blackheads or small bumps from clogged pores. They may come and go, or keep appearing in the same areas.', 'Choose this focus if recurring blemishes are what you most want your routine to address. Your skin can also feel dry or sensitive.'],
 ['Your skin often feels tight, rough or flaky. You might notice dry patches, especially after washing.', 'The skin barrier is the outer protective layer that helps keep moisture in. Choose this focus if dryness and a lack of comfort are your main concerns.'],
 ['Your skin may sting, burn, itch or look red after using skincare products. Products that feel comfortable for others may feel uncomfortable for you.', 'Choose this focus if reacting to products is your main concern. Sensitive skin can be dry, oily or a combination of both.']
];
const unsure="I’m not sure", none='None of the above';
const safety=['I use a prescribed skincare treatment','I am pregnant or breastfeeding','I have a sudden, severe, painful, or unusual skin change','I have a known allergy to a skincare ingredient',none];
const safetyGuidance = new Map([
 [safety[0], "Because you use prescribed skincare, please check with your prescribing clinician before adding new products. Swan won't generate a routine in this version."],
 [safety[1], "Swan doesn't provide personalized product recommendations during pregnancy or breastfeeding in this version. Ask a pharmacist or healthcare professional for advice."],
 [safety[2], "A sudden, severe or unusual skin change needs assessment by a healthcare professional. Please seek medical advice rather than relying on a skincare recommendation."],
 [safety[3], "Swan cannot yet verify a routine against your specific ingredient allergy. Please get professional guidance and check product ingredient labels."],
]);
const levels=['No blemishes right now','A few occasional spots','Several small spots or clogged pores','Frequent spots, sometimes inflamed','Many inflamed or painful spots','Deep, painful lumps or significant scarring'];
const noPreference='No preference';
const cleanserOptions=['Rinse-off','No-rinse',noPreference];
const cleanserExamples=['A cleanser you rinse away with water.','A cleanser you can use without rinsing, such as micellar water.','Swan can suggest either type.'];
const questions={
 adult:['Are you 18 or older?',['Yes','No']],
 safety:['Are any of these true for you?',safety,true],
 concerns:['What would you like your routine to focus on?',[...names,unsure],true],
 priority:['Which concern is your main priority?',[]],
 blemishes:['Which option describes your blemishes right now?',levels],
 skin:['How would you describe your skin type?',['Oily','Dry','Combination','Normal','Not sure']],
 reactivity:['Does your skin react easily to new skincare products?',['Yes','No','Not sure']],
 cleanser:['What kind of cleanser do you prefer?',cleanserOptions]
};
const screen=document.querySelector('#screen'),frame=document.querySelector('#frame'),rail=document.querySelector('#rail');
const layout='split';
let view='welcome', answers={}, guidance=[];
const escapeHTML=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const path=()=>['adult','safety','concerns',...(answers.concerns?.filter(x=>names.includes(x)).length>1?['priority']:[]),...(answers.concerns?.includes(names[0])?['blemishes']:[]),'skin','reactivity','cleanser'];
const action=(id,label,primary=false)=>'<button class="button '+(primary?'primary':'')+'" id="'+id+'">'+label+'</button>';
const heading=t=>'<h1 tabindex="-1">'+escapeHTML(t)+'</h1>';
function render(focus=false){
 frame.dataset.layout=layout;
 frame.dataset.view=view;
 frame.className='frame '+(layout==='rail'?'railmode':layout);
 const stage=view==='welcome'?0:view==='results'?2:1;
 rail.innerHTML='<h2>Your skincare routine</h2><ol>'+['Welcome','Your profile','Your routine'].map((label,i)=>'<li '+(stage===i?'aria-current="step"':'')+'><span class="dot" aria-hidden="true"></span>'+label+'</li>').join('')+'</ol>';
 if(layout==='rail' && view!=='welcome'){
  rail.insertAdjacentHTML('beforeend','<div class="rail-portrait" aria-hidden="true"></div>');
 }
 if(questions[view]){
  const [title,base,multi]=questions[view], options=view==='priority'?answers.concerns:base, index=path().indexOf(view);
  const optional=view==='cleanser';
  const descriptions=view==='concerns'?examples:optional?cleanserExamples:[];
  screen.innerHTML='<div class="progress"><span>Your profile</span><progress aria-label="Profile progress" value="'+(index+1)+'" max="'+path().length+'"></progress></div>'+heading(title)+(multi?'<p>Select all that apply.</p>':optional?'<p>Optional. You can continue without choosing.</p>':'')+'<fieldset class="options '+(view==='concerns'?'chips':'')+'"><legend class="sr">'+title+'</legend>'+options.map((label,i)=>'<label class="option"><input type="'+(multi?'checkbox':'radio')+'" name="answer" value="'+i+'" '+((multi?answers[view]?.includes(label):answers[view]===label)?'checked':'')+'><span><strong>'+escapeHTML(label)+'</strong>'+(descriptions[i]?'<small>'+escapeHTML(descriptions[i])+'</small>':'')+'</span></label>').join('')+'</fieldset>'+(layout==='rail'&&view==='concerns'?'<details class="examples"><summary>Examples of each concern</summary><ul>'+names.map((n,i)=>'<li><strong>'+n+'</strong> — '+examples[i]+'</li>').join('')+'</ul></details>':'')+'<div id="error" class="error" role="status"></div><div class="actions">'+action('back','Back')+action('next',optional?'Review my answers':'Continue',true)+'</div>';
  screen.querySelector('#back').onclick=()=>go(path()[index-1]||'welcome','back');
  screen.querySelector('#next').onclick=()=>{
   const selected=[...screen.querySelectorAll(':checked')].map(el=>options[Number(el.value)]);
   const exclusive=selected.find(x=>x===none||x===unsure);
   if((!optional&&!selected.length)||(exclusive&&selected.length>1)){screen.querySelector('#error').textContent=exclusive?'Select “'+exclusive+'” on its own.':'Choose an answer to continue.';return}
   if(view==='concerns'&&JSON.stringify(answers.concerns)!==JSON.stringify(selected)){delete answers.priority;delete answers.blemishes}
   answers[view]=multi?selected:selected[0]??noPreference;
   if(view==='concerns'&&selected[0]===unsure){go('help','forward');return}
   guidance=[];
   if(view==='adult'&&selected[0]==='No')guidance=["Swan's personalized routine is currently available only to adults aged 18 or over."];
   else if(view==='safety')guidance=selected.map(flag=>safetyGuidance.get(flag)).filter(Boolean);
   else if(view==='blemishes'&&levels.indexOf(selected[0])>=4)guidance=["Your answers describe acne that may need professional assessment. Please contact a healthcare professional or dermatologist. Swan won't recommend a routine in this version."];
   go(guidance.length?'guidance':path()[index+1]||'review','forward');
  };
 }else if(view==='welcome'){
  screen.innerHTML='<div class="hero-copy"><h1 tabindex="-1">A routine for <em>your skin.</em></h1><p>Find a cleanser, moisturizer and facial sunscreen based on what your skin needs.</p>'+action('start','Build my routine',true)+'</div><div class="hero-media"><div class="hero-photo" role="img" aria-label="A woman touching her temple in afternoon light"></div></div>';
  screen.querySelector('#start').onclick=()=>go('adult','forward');
 }else if(view==='help'){
  screen.innerHTML=heading('Find a focus for your routine')+'<p class="help-intro">Think about what you notice most often. These examples can help you choose a focus. Skin concerns can look different on different skin tones, and some signs are felt rather than seen.</p><div class="routine">'+names.map((n,i)=>'<section class="product concern-card"><figure class="concern-visual"><img src="'+concernImages[i].src+'" alt="'+escapeHTML(concernImages[i].alt)+'" width="1254" height="1254" loading="lazy"><figcaption>AI-generated example</figcaption></figure><div class="concern-copy"><h2>'+escapeHTML(n)+'</h2>'+concernHelp[i].map(text=>'<p>'+escapeHTML(text)+'</p>').join('')+'</div></section>').join('')+'</div><p class="help-overlap">If more than one concern sounds familiar, you can select them when you go back. Swan will ask which one matters most to you.</p><div class="actions">'+action('edit','Back to concerns',true)+'</div>';
  screen.querySelector('#edit').onclick=()=>{delete answers.concerns;go('concerns')};
 }else if(view==='review'){
  screen.innerHTML=heading('Review your answers')+'<dl class="review">'+path().map(key=>'<div><dt>'+questions[key][0]+'</dt><dd>'+escapeHTML(Array.isArray(answers[key])?answers[key].join(', '):answers[key]||'')+'</dd></div>').join('')+'</dl><div class="actions">'+action('edit','Edit my answers')+action('show','See my routine',true)+'</div>';
  screen.querySelector('#edit').onclick=()=>go('adult'); screen.querySelector('#show').onclick=()=>go('results');
 }else if(view==='results'){
  const focusLabel=answers.priority||answers.concerns[0];
  screen.innerHTML=heading('Your Swan routine')+'<p>Focus: '+escapeHTML(focusLabel)+'</p><div id="routine-output" role="status"><p>Finding your products…</p></div><div class="actions">'+action('edit','Edit my answers')+'</div>';
  screen.querySelector('#edit').onclick=()=>go('adult');
  loadRoutine(screen.querySelector('#routine-output'),{
   focus:focusLabel, skin:answers.skin, reactivity:answers.reactivity, cleanser:answers.cleanser
  });
 }else{
  screen.innerHTML=heading('Let’s pause here')+guidance.map(message=>'<p>'+escapeHTML(message)+'</p>').join('')+action('edit','Edit my answers',true);
  screen.querySelector('#edit').onclick=()=>go('adult');
 }
 const progress = screen.querySelector('.progress');
 if(progress) screen.querySelector('.actions').prepend(progress);
 if(focus)screen.querySelector('h1').focus();
}
function productPhoto(photo){
 if(!photo) return '';
 const credit=photo.credit_url
  ? '<a href="'+escapeHTML(photo.credit_url)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(photo.credit)+'</a>'
  : escapeHTML(photo.credit);
 return '<figure class="purchase-preview"><img src="'+escapeHTML(photo.url)+'" alt="" referrerpolicy="no-referrer"><figcaption>'+credit+'</figcaption></figure>';
}
function shoppingLinks(links){
 return (links||[]).map(link=>
  '<a class="purchase-link" href="'+escapeHTML(link.url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+escapeHTML(link.label+' (opens in a new tab)')+'">'+escapeHTML(link.label)+' <span aria-hidden="true">↗</span></a>'
 ).join('');
}
async function loadRoutine(output, profile){
 try {
  let previousSunscreen;
  try {previousSunscreen=sessionStorage.getItem('swan-last-sunscreen')||undefined;} catch {}
  const response=await fetch('/api/routine',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({...profile,previous_sunscreen:previousSunscreen})
  });
  if(!response.ok) throw new Error('Routine unavailable');
  const routine=await response.json();
  const sunscreen=routine.steps.find(step=>step.role==='Facial sunscreen');
  try {if(sunscreen?.code) sessionStorage.setItem('swan-last-sunscreen',sunscreen.code);} catch {}
  const message={partial:'Here are the steps Swan could fill.',no_result:'Swan couldn’t verify any products for this routine.'}[routine.status];
  const cards=routine.steps.map(step=>{
   const label='<small>'+escapeHTML(step.role)+'</small>';
   const product=step.name
    ? '<h2>'+escapeHTML(step.name)+'</h2>'
       +(step.brand?'<p><small>'+escapeHTML(step.brand)+'</small></p>':'')
       +(step.cleanser_type?'<p><small>'+escapeHTML(step.cleanser_type)+'</small></p>':'')
       +'<p>'+escapeHTML(step.description)+'</p>'
       +(step.matches_preference===false?'<p class="note">Swan couldn’t match your cleanser preference for this routine.</p>':'')
       +(step.ingredients.length?'<p class="ingredient">Contains '+escapeHTML(step.ingredients.join(' and '))+'.</p>':'')
       +((step.badges||[]).length?'<ul class="product-badges">'+step.badges.map(badge=>'<li>'+escapeHTML(badge)+'</li>').join('')+'</ul>':'')
       +(step.review_note?'<p class="ingredient">'+escapeHTML(step.review_note)+'</p>':'')
       +shoppingLinks(step.shopping_links)
    : '<p>'+escapeHTML(step.unavailable_reason||'Swan couldn’t find a product for this step.')+'</p>';
   return '<article class="product">'+label+productPhoto(step.photo)+product+'</article>';
  });
  output.innerHTML=(message?'<p class="note">'+message+'</p>':'')+'<div class="routine">'+cards.join('')+'</div>';
  output.querySelectorAll('.purchase-preview img').forEach(image=>{
   const hidePreview=()=>image.closest('.purchase-preview').remove();
   image.addEventListener('error',hidePreview,{once:true});
   if(image.complete && !image.naturalWidth) hidePreview();
  });
 }catch(error){
  output.innerHTML='<p class="note">Swan couldn’t load your routine.</p>'+action('retry','Try again');
  output.querySelector('#retry').onclick=()=>{
   output.innerHTML='<p>Finding your products…</p>';
   loadRoutine(output,profile);
  };
 }
}
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let screenAnimation;
function go(next,direction){
 screenAnimation?.cancel();
 const fromWelcome=view==='welcome';
 view=next;
 render(true);
 if(!direction || reducedMotion.matches) return;
 const offset=direction==='back'?-28:28;
 screenAnimation=screen.animate(
  [
   {opacity:0,transform:fromWelcome?'translateY(32px)':`translateX(${offset}px)`},
   {opacity:1,transform:'translate(0, 0)'}
  ],
  {duration:fromWelcome?650:520,easing:'cubic-bezier(0.25, 0.65, 0.3, 1)'}
 );
}
document.querySelector('#reset').onclick=()=>{answers={};go('welcome')};
render();
</script></body></html>
