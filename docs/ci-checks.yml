name: MVP checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps
      - run: pip check
      - run: python scripts/download_data.py
      - run: pytest -q
