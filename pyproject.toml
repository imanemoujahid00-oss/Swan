[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "swan-mvp"
version = "0.1.0"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
include = ["models*", "api*", "swan_ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
